[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vedika"]

[project]
name = "vedika"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-text-splitters>=1.1.2",
    "loguru>=0.7.3",
    "omegaconf>=2.3.1",
    "pydantic>=2.12.5",
    "pygithub==2.10.0",
    "pymongo>=4.17.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "python-dotenv==1.2.3",
    "qdrant-client>=1.19.0",
    "tqdm>=4.70.0",
    "zenml[server]>=0.96.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "rich-cli>=1.8.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Add "I" to your selected rules to enable isort
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["vedika"] # Replaces isort's known_first_party

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

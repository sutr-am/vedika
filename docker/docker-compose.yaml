services:
    mongodb:
        image: mongo:latest
        container_name: vedika_mongo
        restart: always
        ports:
            - "${MONGO_PORT:-27017}:27017"
        environment:
            # Map the reserved MongoDB keys to your custom .env variables
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
            MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
        volumes:
            - mongo_data:/data/db

    qdrant:
        image: qdrant/qdrant:latest
        container_name: vedika_qdrant
        restart: always
        ports:
            - "${QDRANT_PORT:-6333}:6333"
            - "6334:6334" # gRPC port
        volumes:
            - qdrant_data:/qdrant/storage

volumes:
    mongo_data:
    qdrant_data:
